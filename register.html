      <!-- Left Side: Main Links & Dropdowns -->

        <!-- Dropdown 1 -->

          <a href="brands.html" class="nav-link">Brands ▾</a>
          <ul class="dropdown-menu">
            <li><a href="addidas.html">Addidas</a></li>

    <main class="auth-container">
      <div class="auth-card">
        <h2>Create an Account</h2>
        <p class="auth-subtitle">Join us to discover the latest footwear collections.</p>

        <form action="#" method="POST" class="auth-form">
          <!-- Full Name Field -->
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
          </div>

          <!-- Email Address Field -->
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
          </div>

          <!-- Street Address Field -->
          <div class="form-group">
            <label for="address">Street Address</label>
            <input type="text" id="address" name="address" placeholder="123 Main Street, Apt 4B" required>
          </div>

          <!-- City & Postal Code Fields -->
          <div class="form-row" style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
              <label for="city">City</label>
              <input type="text" id="city" name="city" placeholder="New York" required>
            </div>

            <div class="form-group" style="flex: 1;">
              <label for="postal-code">ZIP / Postal Code</label>
              <input type="text" id="postal-code" name="postal-code" placeholder="10001" required>
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
          </div>

          <!-- Confirm Password Field -->
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" required>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="submit-btn">Register</button>
        </form>

        <!-- Switch to Login Page Link -->
        <p class="switch-auth">
          Already have an account? <a href="login.html">Login here</a>
        </p>
      </div>
    </main>

    <script>
      document.querySelector('.auth-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        // Check if passwords match
        if (password !== confirmPassword) {
          alert("Passwords do not match!");
          return;
        }

        // Retrieve existing registered users list from localStorage
        let users = JSON.parse(localStorage.getItem('registeredUsers')) || [];

        // Check if email is already registered
        const userExists = users.some(user => user.email === email);
        if (userExists) {
          alert("An account with this email already exists! Please log in instead.");
          window.location.href = 'login.html';
          return;
        }

        // Save new user
        users.push({ email: email, password: password });
        localStorage.setItem('registeredUsers', JSON.stringify(users));

        alert("Registration successful! You can now log in.");
        window.location.href = 'login.html';
      });
    </script>
  </body>
</html>
